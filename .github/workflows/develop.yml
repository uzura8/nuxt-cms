name: develop

on:
  push:
    branches:
      - develop
    paths:
      - "frontend/**"
      - "serverless/nuxt-ssr/**"

jobs:
  deploy:
    name: Build once, upload static (S3) and SSR Lambda (dev)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials from account
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Download config file from S3
        env:
          S3_CONFIG_BUCKET: ${{ vars.S3_CONFIG_BUCKET_DEV }}
        run: |
          set -euo pipefail
          cd frontend
          mkdir -p ./app/configs

          echo "S3_CONFIG_BUCKET=s3://${S3_CONFIG_BUCKET}/"
          aws s3 ls "s3://${S3_CONFIG_BUCKET}/" || true
          aws s3 cp "s3://${S3_CONFIG_BUCKET}/config.json" "./app/configs/config.json" --no-progress

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # 1 回のビルドで .output/public（S3）と .output/server（Lambda）のハッシュを揃える
      - name: Install dependencies and build Nuxt (frontend)
        env:
          NUXT_PUBLIC_SITE_URL: ${{ vars.NUXT_PUBLIC_SITE_URL }}
          NUXT_PUBLIC_SITE_NAME: ${{ vars.NUXT_PUBLIC_SITE_NAME }}
        run: |
          set -euo pipefail
          cd frontend
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Sync static files to S3
        env:
          S3_RESOURCE_BUCKET: ${{ vars.S3_RESOURCE_BUCKET_DEV }}
        run: |
          set -euo pipefail
          cd frontend
          echo "S3_RESOURCE_BUCKET=s3://${S3_RESOURCE_BUCKET}/"
          aws s3 sync ./.output/public "s3://${S3_RESOURCE_BUCKET}"

      - name: Install serverless service dependencies
        run: |
          set -euo pipefail
          cd serverless/nuxt-ssr
          pnpm install --frozen-lockfile

      - name: Deploy SSR Lambda (dev)
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
          NUXT_PUBLIC_SITE_URL: ${{ vars.NUXT_PUBLIC_SITE_URL }}
          NUXT_PUBLIC_SITE_NAME: ${{ vars.NUXT_PUBLIC_SITE_NAME }}
        run: |
          set -euo pipefail
          cd serverless/nuxt-ssr
          pnpm run sync:nitro
          pnpm exec serverless deploy --stage dev

      - name: Clear cache in CloudFront
        uses: chetan/invalidate-cloudfront-action@v1.2
        env:
          DISTRIBUTION: ${{ vars.CLOUDFRONT_DISTRIBUTION_DEV }}
          PATHS: "/*"
          AWS_REGION: ap-northeast-1
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
