name: nuxt-ssr

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "frontend/**"
      - "serverless/nuxt-ssr/**"
  workflow_dispatch: {}

jobs:
  package-and-deploy:
    name: Package and deploy SSR Lambda
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Download app config from S3 (frontend)
        env:
          S3_CONFIG_BUCKET_DEV: ${{ vars.S3_CONFIG_BUCKET_DEV }}
          S3_CONFIG_BUCKET: ${{ vars.S3_CONFIG_BUCKET }}
        run: |
          cd frontend
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            BUCKET="${S3_CONFIG_BUCKET}"
          else
            BUCKET="${S3_CONFIG_BUCKET_DEV}"
          fi
          aws s3 cp "s3://${BUCKET}/config.json" "app/configs/config.json" --quiet

      - name: Install dependencies (frontend)
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Build Nuxt (Nitro aws_lambda)
        env:
          NUXT_PUBLIC_SITE_URL: ${{ vars.NUXT_PUBLIC_SITE_URL }}
          NUXT_PUBLIC_SITE_NAME: ${{ vars.NUXT_PUBLIC_SITE_NAME }}
        run: |
          cd frontend
          pnpm run build

      - name: Install dependencies (serverless)
        run: |
          cd serverless/nuxt-ssr
          pnpm install --frozen-lockfile

      - name: Serverless package (SSR Lambda)
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
          NUXT_PUBLIC_SITE_URL: ${{ vars.NUXT_PUBLIC_SITE_URL }}
          NUXT_PUBLIC_SITE_NAME: ${{ vars.NUXT_PUBLIC_SITE_NAME }}
        run: |
          cd serverless/nuxt-ssr
          pnpm run sync:nitro
          pnpm exec serverless package

      - name: Serverless deploy (SSR Lambda)
        if: github.ref == 'refs/heads/main'
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
          NUXT_PUBLIC_SITE_URL: ${{ vars.NUXT_PUBLIC_SITE_URL }}
          NUXT_PUBLIC_SITE_NAME: ${{ vars.NUXT_PUBLIC_SITE_NAME }}
        run: |
          cd serverless/nuxt-ssr
          pnpm exec serverless deploy --stage prod

