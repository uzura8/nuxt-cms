name: production

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"

jobs:
  deploy:
    name: Upload to S3
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials from account
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Download config file from S3
        env:
          S3_CONFIG_BUCKET: ${{ vars.S3_CONFIG_BUCKET }}
        run: |
          set -euo pipefail
          cd frontend
          mkdir -p ./app/configs

          echo "S3_CONFIG_BUCKET=s3://${S3_CONFIG_BUCKET}/"
          aws s3 ls "s3://${S3_CONFIG_BUCKET}/" || true

          aws s3 cp "s3://${S3_CONFIG_BUCKET}/config.json" "./app/configs/config.json" --no-progress
          aws s3 cp "s3://${S3_CONFIG_BUCKET}/firebase-app-sdk-config.json" "./app/configs/firebase-app-sdk-config.json" --no-progress

      - name: Build by Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: |
          cd frontend
          npm install
          npm run build

      - name: Sync Files to s3
        env:
          S3_RESOURCE_BUCKET: ${{ vars.S3_RESOURCE_BUCKET }}
        run: |
          set -euo pipefail
          cd frontend
          echo "S3_RESOURCE_BUCKET=s3://${S3_RESOURCE_BUCKET}/"
          aws s3 sync ./.output/public "s3://${S3_RESOURCE_BUCKET}"

      # Clear CloudFront Caches
      - name: Clear cache in CloudFront
        uses: chetan/invalidate-cloudfront-action@v1.2
        env:
          DISTRIBUTION: ${{ vars.CLOUDFRONT_DISTRIBUTION }}
          PATHS: "/*"
          AWS_REGION: ap-northeast-1
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
